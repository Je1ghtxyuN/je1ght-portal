server {
    listen 80;
    server_name je1ght.top www.je1ght.top;

    root /www/portal;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:3001/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /admin {
        return 301 /admin/;
    }

    # Keep Admin HTML, CSS, and JavaScript on the backend. Without ^~, the
    # generic static CSS/JS regex locations below take precedence and return 404.
    location ^~ /admin/ {
        rewrite ^/admin/$ /admin/index.html break;
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /auth/ {
        proxy_pass http://127.0.0.1:3001/auth/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /assets/ {
        proxy_pass http://127.0.0.1:3001/assets/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /health {
        proxy_pass http://127.0.0.1:3001/health;
        proxy_http_version 1.1;
    }

    location /site-profile {
        proxy_pass http://127.0.0.1:3001/site-profile;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /blog/admin/ {
        proxy_pass http://127.0.0.1:3001/blog/admin/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /portfolio/admin/ {
        proxy_pass http://127.0.0.1:3001/portfolio/admin/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /waline/ {
        proxy_pass http://127.0.0.1:8360/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /favicon.ico {
        try_files /shared-assets/images/icon.png =404;
    }
    location = /apple-touch-icon.png {
        try_files /shared-assets/images/icon.png =404;
    }
    location = /apple-touch-icon-precomposed.png {
        try_files /shared-assets/images/icon.png =404;
    }
    location = /logo.png {
        try_files /shared-assets/images/icon.png =404;
    }
    location = /img/favicon.ico {
        try_files /shared-assets/images/icon.png =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.html$ {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri =404;
    }
    location ~* \.css$ {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri =404;
    }
    location ~* \.js$ {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri =404;
    }
}
