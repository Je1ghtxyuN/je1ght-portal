services:
  backend-api:
    build:
      context: ./backend-api
    image: je1ght-backend-api:latest
    container_name: je1ght-backend-api
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - /home/je1ght/code/websites/je1ght-platform/portal-source:/portal-source:rw
    ports:
      - "127.0.0.1:3001:3001"
    networks:
      - database_default
      - internet

  waline:
    image: lizheming/waline:latest
    container_name: je1ght-waline
    restart: unless-stopped
    environment:
      MYSQL_HOST: je1ght-mysql
      MYSQL_PORT: 3306
      MYSQL_DB: je1ght_space
      MYSQL_USER: je1ght
      MYSQL_PASSWORD: ${WALINE_DB_PASSWORD:?set WALINE_DB_PASSWORD in .env}
      JWT_TOKEN: ${WALINE_JWT_TOKEN}
      SITE_NAME: Je1ghtxyuN
      SITE_URL: https://je1ght.top
      SERVER_URL: https://je1ght.top/waline
      SECURE_DOMAINS: je1ght.top
    networks:
      - internet
      - database_default
    ports:
      - "127.0.0.1:8360:8360"

networks:
  database_default:
    external: true
  internet:
    driver: bridge
