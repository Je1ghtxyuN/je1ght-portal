services:
  backend-api:
    build:
      context: ./backend-api
    image: je1ght-backend-api:latest
    container_name: je1ght-backend-api
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - /home/je1ght/websites/je1ght-platform/portal-source:/portal-source:rw
    networks:
      - database_default
      - internet

  waline:
    image: lizheming/waline:latest
    container_name: je1ght-waline
    restart: unless-stopped
    environment:
      MYSQL_HOST: je1ght-mysql
      MYSQL_PORT: 3306
      MYSQL_DB: je1ght_space
      MYSQL_USER: je1ght
      MYSQL_PASSWORD: 2586
      JWT_TOKEN: ${WALINE_JWT_TOKEN}
      SITE_NAME: Je1ghtxyuN
      SITE_URL: https://je1ght.top
      SERVER_URL: https://je1ght.top/waline
      SECURE_DOMAINS: je1ght.top
    networks:
      - internet
      - database_default

  nginx:
    image: nginx:alpine
    container_name: je1ght-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - /home/je1ght/websites/je1ght-platform/portal-source/public:/usr/share/nginx/html:ro
    networks:
      - database_default
      - internet
    depends_on:
      - backend-api

networks:
  database_default:
    external: true
  internet:
    driver: bridge
